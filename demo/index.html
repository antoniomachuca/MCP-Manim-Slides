<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Light ground","default":"#F1F0EC"},
    {"id":"color-night","type":"color","label":"Terminal ground","default":"#0D0D0F"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#17171A"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#E07A5F"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #f1f0ec;
        --color-night: #0d0d0f;
        --color-ink: #17171a;
        --color-accent: #e07a5f;
        --font-display: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40"
      data-width="1920"
      data-height="1080"
    >
      <div id="ask" data-composition-id="ask" data-composition-src="compositions/ask.html"
        data-start="0" data-duration="3.4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="byhand" data-composition-id="byhand" data-composition-src="compositions/byhand.html"
        data-start="3.4" data-duration="6.8" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="session" data-composition-id="session" data-composition-src="compositions/session.html"
        data-start="9.5" data-duration="17.5" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="result" data-composition-id="result" data-composition-src="compositions/result.html"
        data-start="27" data-duration="7.4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 4"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html"
        data-start="34.2" data-duration="5.8" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 5"></div>

      <!-- Sound: bundled HyperFrames SFX, each placed on the action that causes it. -->
      <audio id="sfx-type-ask" class="clip" src="assets/sfx/typing.mp3" data-start="0.1" data-duration="1.5" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-type-ask2" class="clip" src="assets/sfx/typing.mp3" data-start="1.5" data-duration="0.9" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-whoosh-up" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="2.75" data-duration="0.57" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-type-cmd1" class="clip" src="assets/sfx/typing.mp3" data-start="4.3" data-duration="0.9" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-type-cmd2" class="clip" src="assets/sfx/typing.mp3" data-start="6.9" data-duration="0.8" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-click-agent" class="clip" src="assets/sfx/click.mp3" data-start="9.13" data-duration="0.36" data-track-index="12" data-volume="0.9"></audio>
      <audio id="sfx-whoosh-iris" class="clip" src="assets/sfx/whoosh.mp3" data-start="9.45" data-duration="0.57" data-track-index="13" data-volume="0.6"></audio>
      <audio id="sfx-type-prompt" class="clip" src="assets/sfx/typing.mp3" data-start="10.1" data-duration="1.5" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-type-prompt2" class="clip" src="assets/sfx/typing.mp3" data-start="11.35" data-duration="0.85" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-enter" class="clip" src="assets/sfx/key-press.mp3" data-start="12.38" data-duration="0.4" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-pop-card" class="clip" src="assets/sfx/pop.mp3" data-start="16.53" data-duration="0.72" data-track-index="13" data-volume="0.6"></audio>
      <audio id="sfx-pop-fix" class="clip" src="assets/sfx/click-soft.mp3" data-start="21.53" data-duration="0.36" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-whoosh-carry" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="25.85" data-duration="0.57" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="24.15" data-duration="3.5" data-track-index="15" data-volume="0.4" data-fade-out="0.25"></audio>
      <audio id="sfx-whoosh-grow" class="clip" src="assets/sfx/whoosh.mp3" data-start="26.95" data-duration="0.57" data-track-index="13" data-volume="0.7"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="27.62" data-duration="2.1" data-track-index="14" data-volume="0.55"></audio>
      <audio id="sfx-whoosh-end" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="33.9" data-duration="0.57" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-type-clone" class="clip" src="assets/sfx/typing.mp3" data-start="35.35" data-duration="1.2" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-click-star" class="clip" src="assets/sfx/click.mp3" data-start="37.68" data-duration="0.36" data-track-index="11" data-volume="0.9"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
