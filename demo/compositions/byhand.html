<div class="ln"><span class="no">44</span>                side_length=0.92, stroke_width=0, fill_color=color, fill_opacity=1</div>
<div class="ln"><span class="no">45</span>            )</div>
<div class="ln"><span class="no">46</span>            cell.rotate(angle).move_to(center)</div>
